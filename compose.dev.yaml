services:
  db:
    image: postgres:16-alpine
    container_name: mdz-postgres-dev
    environment:
      POSTGRES_DB: mdzmueblesbd
      POSTGRES_USER: mdz
      POSTGRES_PASSWORD: mdz
    ports:
      - "5436:5432" # 5432 (Postgres nativo), 5434 y 5435 ya estan ocupados en esta maquina
    volumes:
      - mdz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdz -d mdzmueblesbd"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP falso para desarrollo: los mails "enviados" quedan atrapados acá,
  # nunca salen a internet. UI web en http://localhost:8125 para verlos.
  # No requiere usuario/contraseña ni cuenta en ningún lado.
  mailpit:
    image: axllent/mailpit
    container_name: mdz-mailpit-dev
    ports:
      - "1125:1025" # SMTP (1025 lo usa otro proyecto en esta máquina)
      - "8125:8025" # UI web (http://localhost:8125)

volumes:
  mdz-postgres-data:

# DataBase Configuration


spring.datasource.url = jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Show or not log for each sql query
spring.jpa.show-sql=true
# Hibernate ddl auto (create, create-drop, update): with "create-drop" the database
# schema will be automatically created afresh for every start of application
spring.jpa.hibernate.ddl-auto=update
# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.user.datasource.driver-class-name=com.mysql.jdbc.driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.servlet.multipart.max-file-size=10MB
# Tamaño máximo total de la petición (por ejemplo, 50MB)
spring.servlet.multipart.max-request-size=50MB

# Logging Configuration - Solo mostrar logs de tu aplicación
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.apache=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.boot=ERROR

# Mantener solo los logs de tu aplicación para ver lo que va ejecutando
logging.level.com.Capinteria.carpinteria=INFO

# Configurar el patrón del log más limpio - solo hora, nivel y mensaje
logging.pattern.console=%clr(%d{HH:mm:ss}){blue} %clr(%5p){green} %clr(:){faint} %m%n

# Deshabilitar banner de Spring Boot
spring.main.banner-mode=off






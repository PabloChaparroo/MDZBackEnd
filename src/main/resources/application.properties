# Server Configuration
server.port=9091

# DataBase Configuration


spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Show or not log for each sql query
spring.jpa.show-sql=false
# El esquema lo maneja Flyway (db/migration). Hibernate solo valida que coincida con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=10MB
# Tamaño máximo total de la petición (por ejemplo, 50MB)
spring.servlet.multipart.max-request-size=50MB

# Clave del administrador inicial: sin definir, no se crea
mdz.admin.password=${ADMIN_PASSWORD:}

# Mail (SMTP): se configura por variables de entorno
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Remitente de los mails y casilla donde llegan los avisos de consultas nuevas
mdz.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
mdz.mail.admin=${MAIL_ADMIN:${MAIL_USERNAME:}}

# Logging Configuration - Solo mostrar logs de tu aplicación
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.apache=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.boot=ERROR

# Mantener solo los logs de tu aplicación para ver lo que va ejecutando
logging.level.com.Capinteria.carpinteria=INFO

# Configurar el patrón del log más limpio - solo hora, nivel y mensaje
logging.pattern.console=%clr(%d{HH:mm:ss}){blue} %clr(%5p){green} %clr(:){faint} %m%n

# Deshabilitar banner de Spring Boot
spring.main.banner-mode=off






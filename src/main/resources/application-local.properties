# Configuración local para desarrollo
spring.datasource.url=jdbc:mysql://localhost:3306/mdzmueblesbd
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.user.datasource.driver-class-name=com.mysql.jdbc.driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# SMTP de prueba (Mailpit, ver compose.dev.yaml) - NO es Gmail. Los mails quedan
# atrapados localmente, se ven en http://localhost:8125. Cuando esté listo se
# reemplaza por un proveedor real (Gmail, SendGrid, etc.) cambiando estas 4 líneas.
spring.mail.host=localhost
spring.mail.port=1125
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
mdz.mail.from=no-responder@mdzmuebles.local
mdz.mail.admin=consultas@mdzmuebles.local
mdz.admin.password=123456
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.apache=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.boot=ERROR
logging.level.com.Capinteria.carpinteria=INFO
logging.pattern.console=%clr(%d{HH:mm:ss}){blue} %clr(%5p){green} %clr(:){faint} %m%n
spring.main.banner-mode=off


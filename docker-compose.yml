version: '3.8'

services:
  # Base de datos MySQL
  mysql-db:
    image: mysql:8.0
    container_name: mdzmueblesbd
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mdzMueblesbd
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mdzmueblesnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Aplicación Spring Boot
  mdzmueblesback:
    build: .
    container_name: mdzmueblesback
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/mdzMueblesbd
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - mdzmueblesnet
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  mdzmueblesnet:
    driver: bridge

# Sistema completo en contenedores, igual que en producción:
# la imagen del Dockerfile + PostgreSQL 16 (Flyway crea el esquema al arrancar)
# + Mailpit como SMTP falso. Usa el perfil POR DEFECTO de Spring (variables de entorno),
# no el perfil local.
#
#   docker compose up --build        -> API en http://localhost:9091 (GET /ping)
#   Mails "enviados": http://localhost:8126
#   docker compose down -v           -> borra también la base
#
# Para desarrollar día a día se sigue usando compose.dev.yaml + `npm run dev`.
# Este archivo es para probar la imagen de producción de punta a punta.
#
# OJO: docker compose lee automáticamente el .env de esta carpeta, que tiene el SMTP real.
# Por eso acá ningún valor sale de variables (${...}): todo está fijo y el mail va a Mailpit.
# Las claves de este archivo son SOLO para este stack local; producción usa otras (ver .env.example).

name: mdz-stack

services:
  db:
    image: postgres:16-alpine
    container_name: mdz-stack-db
    environment:
      POSTGRES_DB: mdzmuebles
      POSTGRES_USER: mdz
      POSTGRES_PASSWORD: mdz-stack
    volumes:
      - mdz-stack-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdz -d mdzmuebles"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin puertos publicados: solo la app accede (y no choca con el Postgres de desarrollo)

  mailpit:
    image: axllent/mailpit
    container_name: mdz-stack-mailpit
    environment:
      # La app usa smtp.auth=true (como con el SMTP real): Mailpit acepta cualquier usuario
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8126:8025" # UI web (8125 la usa el Mailpit de desarrollo)

  app:
    build: .
    container_name: mdz-stack-app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "9091:9091"
    environment:
      PORT: "9091"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: mdzmuebles
      DB_USER: mdz
      DB_PASSWORD: mdz-stack
      DB_SSLMODE: disable
      JWT_SECRET: "c3RhY2stbG9jYWwtc29sby1wYXJhLWRvY2tlci1jb21wb3NlLTMyYnl0ZXM="
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      ADMIN_PASSWORD: admin-stack
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: mdz-stack
      MAIL_PASSWORD: mdz-stack
      MAIL_FROM: no-reply@mdzmuebles.local
      MAIL_ADMIN: consultas@mdzmuebles.local
    mem_limit: 512m # mismo límite que el plan gratis de Render
    restart: unless-stopped

volumes:
  mdz-stack-data:
